<svg xmlns="http://www.w3.org/2000/svg" viewBox="0 0 24 24" width="32" height="32">
  <title>Talktitles</title>
  <desc>Two caption bubbles across a table: the near reader's (mint, upright) and the far reader's (coral, turned 180 degrees). Drawn from GRID in assets/generate-assets.py on a 24-unit grid.</desc>
  <defs><linearGradient id="tile" x1="0" y1="0" x2="0" y2="1"><stop offset="0" stop-color="#243041"/><stop offset="1" stop-color="#0B1016"/></linearGradient></defs>
  <rect id="grid" width="24" height="24" fill="url(#tile)" data-grid='{"tile": 24, "near_bubble": [7.0, 12.5, 21.0, 20.5], "radius": 3.0, "near_tail": [[9.0, 20.0], [13.0, 20.0], [8.0, 23.0]], "near_bars": [[9.5, 14.6, 18.5, 16.2], [9.5, 17.0, 15.5, 18.6]], "bar_radius": 0.8, "turn": 180}'/>
  <g id="far">
    <rect x="3" y="3.5" width="14" height="8" rx="3" fill="#FF7A59"/>
    <polygon points="15,4 11,4 16,1" fill="#FF7A59"/>
    <rect x="5.5" y="7.8" width="9" height="1.6" rx="0.8" fill="#121821"/>
    <rect x="8.5" y="5.4" width="6" height="1.6" rx="0.8" fill="#121821"/>
  </g>
  <g id="near">
    <rect x="7" y="12.5" width="14" height="8" rx="3" fill="#54E0B0"/>
    <polygon points="9,20 13,20 8,23" fill="#54E0B0"/>
    <rect x="9.5" y="14.6" width="9" height="1.6" rx="0.8" fill="#121821"/>
    <rect x="9.5" y="17" width="6" height="1.6" rx="0.8" fill="#121821"/>
  </g>
</svg>
